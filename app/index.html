<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip the Number — prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Rack</h1>

  <button id="new-game">New game</button>

  <div id="message"></div>
  <div id="selection-sum"></div>

  <div id="rack"></div>

  <div id="dice-choice">
    <button id="choice-one">1 die</button>
    <button id="choice-two">2 dice</button>
  </div>

  <div id="dice-area"></div>

  <div class="action-row">
    <button id="roll" class="primary">Roll</button>
    <button id="confirm" class="primary">Confirm</button>
  </div>

  <script src="theme.js"></script>
  <script src="game.js"></script>
</body>
</html>
